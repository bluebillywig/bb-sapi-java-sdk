name: Create release branch
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version - major.minor only (e.g. 1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      # Inputs go through env, never straight into the script.
      - name: Validate version format
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Expected major.minor (e.g. 1.2)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Create release branch
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          git checkout -b "release/v${VERSION_INPUT}"
          git push origin "release/v${VERSION_INPUT}"
