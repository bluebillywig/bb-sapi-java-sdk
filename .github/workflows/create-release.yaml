name: Create release
on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch version override (digits; leave empty to auto-increment from latest)"
        required: false
        type: string

# Uses the built-in GITHUB_TOKEN only. A release created with it does not fire the
# `release: published` event, so this workflow starts publish.yaml explicitly (workflow_dispatch
# is the one event GITHUB_TOKEN may trigger; it needs actions: write).
permissions:
  contents: write
  actions: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^release/v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow must be run from a release branch (release/v*.*), got '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_INPUT: ${{ inputs.patch }}
        run: |
          set -euo pipefail
          MAJOR_MINOR="${GITHUB_REF_NAME#release/v}"

          if [[ -n "$PATCH_INPUT" ]]; then
            if [[ ! "$PATCH_INPUT" =~ ^[0-9]+$ ]]; then
              echo "::error::patch must be digits only"
              exit 1
            fi
            PATCH="$PATCH_INPUT"
          else
            # Find the latest patch version for this major.minor
            LATEST_TAG=$(gh release list --limit 1000 --json tagName -q '.[].tagName' \
              | { grep -E "^v${MAJOR_MINOR}\.[0-9]+$" || true; } \
              | sort -V \
              | tail -n 1)

            if [[ -n "$LATEST_TAG" ]]; then
              LATEST_PATCH="${LATEST_TAG##*.}"
              PATCH=$((LATEST_PATCH + 1))
            else
              PATCH=0
            fi
          fi

          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_REF_NAME" \
            --title "$TAG" \
            --generate-notes

      - name: Start the Maven Central publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yaml --ref master -f tag="$TAG"
