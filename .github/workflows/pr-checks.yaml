name: Pull request checks
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  pr_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      # The release profile (sources + javadoc jars, javadoc failOnWarnings) otherwise only runs at
      # release time, after the tag exists.
      - name: Build the release artifacts (unsigned)
        run: mvn -B -P release -Dgpg.skip=true -DskipTests package
